quarkus.http.port=${PORT:8080}
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=${DB_URL:jdbc:h2:file:./data/filmes;AUTO_SERVER=TRUE}
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5
quarkus.hibernate-orm.schema-management.strategy=update

%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:filmes-test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.http.test-port=18081
%test.quarkus.rest-client.filmes-mock.url=http://127.0.0.1:18081

quarkus.rest-client.filmes-mock.url=${FILMES_MOCK_URL:http://127.0.0.1:8080}
quarkus.rest-client.filmes-mock.connect-timeout=1000
quarkus.rest-client.filmes-mock.read-timeout=1000

app.nome=${APP_NOME:Filmes Favoritos API}
app.readiness.inicialmente-pronta=true
quarkus.micrometer.export.prometheus.enabled=true
